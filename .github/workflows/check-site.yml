name: Check website

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Uses .ruby-version and Gemfile.lock, matching the local bundle exec workflow.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Validate content and asset references
        run: bundle exec ruby scripts/validate.rb
      - name: Build production website
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Exercise contributor templates in a temporary copy
        run: JEKYLL_ENV=production bundle exec ruby scripts/check-build.rb
