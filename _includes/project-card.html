<article class="project-card">
  <h3><a href="{{ include.project.url | relative_url }}">{{ include.project.title | escape }}</a></h3>
  {% if include.project.image %}
  <a href="{{ include.project.url | relative_url }}"><img src="{{ include.project.image | relative_url }}" alt="{{ include.project.image_alt | escape }}" loading="lazy"></a>
  {% endif %}
  <p>{{ include.project.summary | escape }}</p>
</article>
