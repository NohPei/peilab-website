---
layout: page
---
<article class="post">
  <h1 class="post-title">{{ page.title | escape }}</h1>
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.author %} · {{ page.author | escape }}{% endif %}</p>
  {{ content }}
</article>
