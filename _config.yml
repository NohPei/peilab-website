# Basic
name:               "PEI Lab"
title:              "Pervasive Electronics Innovation at the University of Michigan"
description:        "The PEI Lab is an electrical & computer engineering research group at the University of Michigan, Ann Arbor."


# URL
url:                https://peilab.eecs.umich.edu
baseurl:            
#baseurl:            "" #For Root Domain
permalink:          /:year/:month/:day/:title.html

# Markdown
markdown:           kramdown

# Contributor resources and development tooling are not published.
exclude:
  - docker-compose.yml
  - AGENTS.md
  - README.md
  - CONTRIBUTING.md
  - docs
  - templates
  - scripts
  - _guides
  - .refactor-check

# Highlighter
highlighter:        rouge

# Navigation labels and links live in _data/navigation.yml.


# Sass
sass:
  style:            :compressed

# Scopes
defaults:
  -
    scope:
      path:         ""
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      path:         ""
      type:         "people"
    values:
      layout:       "profile"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
      order: 100
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"


collections:
  people:
    output: true
    permalink: /people/:title/index.html
  projects:
    output: true
    permalink: /project/:name/
  publications:
    output: false
